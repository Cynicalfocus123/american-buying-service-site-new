name: Deploy latest site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy live site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified live site
        uses: actions/upload-pages-artifact@v4
        with:
          path: live

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show latest live site link
        run: |
          echo "## Latest American Buying Service site" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the live site](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"
